name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use declared npm version
        run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Create isolated SQLite installation
        shell: bash
        run: |
          ci_workspace=$(mktemp -d "$RUNNER_TEMP/binvault-ci-XXXXXX")
          echo "DATABASE_URL=file:$ci_workspace/application.db" >> "$GITHUB_ENV"
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run production:init
      - run: npx prisma migrate deploy
      - run: npm run test:run
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: git diff --check
      - name: Report dependency advisories; fail on critical
        run: npm audit --audit-level=critical
